name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS: Apple's system JavaScriptCore framework; Apple-silicon runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      # `cargo run`/`cargo test` auto-sign via scripts/sign-and-run.sh so JSC's
      # JIT is enabled; ad-hoc codesign works on the runner.
      - name: Full test suite (unit + compat suites + examples)
        run: ./scripts/test-all.sh

      - name: Node.js test suite (curated subset)
        run: ./scripts/node-test.sh

  linux:
    # Linux: JavaScriptCore C API via WebKitGTK's libjavascriptcoregtk-4.1
    # (build.rs locates it with pkg-config). The JIT needs no code-signing here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScriptCore (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjavascriptcoregtk-4.1-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      # node-compat-extra first: it exercises the highest-risk C-API surface
      # (SharedArrayBuffer / no-copy ArrayBuffer / typed arrays) on WebKitGTK.
      - name: Smoke (hello + node-compat suites)
        run: |
          cargo run -- examples/hello.ts
          for f in examples/node-compat-extra.ts \
                   examples/node-compat-core.ts \
                   examples/node-compat-io.ts \
                   examples/node-compat-modern.ts; do
            echo "== $f =="
            cargo run -- "$f"
          done
